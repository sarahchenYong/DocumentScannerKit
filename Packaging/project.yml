name: ScannerKitBinary
options:
  deploymentTarget:
    iOS: "16.0"
targets:
  DocumentScannerKit:
    type: framework
    platform: iOS
    sources:
      - path: ../Sources/DocumentScannerKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.byvyomi.scannerkit.documentscannerkit
        SWIFT_VERSION: 5.9
        GENERATE_INFOPLIST_FILE: YES
        BUILD_LIBRARY_FOR_DISTRIBUTION: NO
  IDScanner:
    type: framework
    platform: iOS
    sources:
      - path: ../Sources/IDScanner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.byvyomi.scannerkit.idscanner
        SWIFT_VERSION: 5.9
        GENERATE_INFOPLIST_FILE: YES
        BUILD_LIBRARY_FOR_DISTRIBUTION: NO
    dependencies:
      - target: DocumentScannerKit
  ScannerKit:
    type: framework
    platform: iOS
    sources:
      - path: ../Sources/ScannerKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.byvyomi.scannerkit
        SWIFT_VERSION: 5.9
        GENERATE_INFOPLIST_FILE: YES
        BUILD_LIBRARY_FOR_DISTRIBUTION: NO
    dependencies:
      - target: DocumentScannerKit
      - target: IDScanner
